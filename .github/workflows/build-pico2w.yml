name: Build EmuToLife Pico W variants

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [picow, pico2w]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        working-directory: firmware
        run: pio run -e ${{ matrix.env }} --target buildunified

      - name: Save build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EmuToLife-${{ matrix.env }}-build
          path: firmware/.pio/build/${{ matrix.env }}/
          if-no-files-found: warn
